name: Publish

# Runs when a GitHub release is published (tag vX.Y.Z). STAGES the package on npm with trusted
# publishing (OIDC, no token, with provenance) and attaches the Claude Desktop bundle.
# Nothing goes live until the maintainer approves the stage with 2FA (see docs/releasing.md).

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # npm 12 (staged publishing) needs Node ^22.22.2 || ^24.15.0 || >=26.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@12

      - name: Tag must match every pinned version
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: docker pull -q greenmail/standalone:2.1.5

      - run: pnpm test
        env:
          REQUIRE_INTEGRATION: '1'

      # Already built and tested above; --ignore-scripts skips prepublishOnly running them again.
      - name: Stage on npm (goes live only after 2FA approval)
        run: |
          npm stage publish . --access public --provenance --ignore-scripts --json > stage.json || { cat stage.json; exit 1; }
          cat stage.json
          node scripts/stage-summary.mjs stage.json >> "$GITHUB_STEP_SUMMARY"
          node scripts/stage-summary.mjs stage.json

  mcpb:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the bundle to the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/pack-mcpb.mjs

      - run: gh release upload "${GITHUB_REF_NAME}" "dist-mcpb/allinbox.mcpb" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
