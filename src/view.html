<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>allinbox</title>
<style>
  /* Glass UI. Host fonts are honored; colors are our own so the frosted look survives any host. */
  :root {
    color-scheme: light;
    --sans: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --base: #eef0fb;
    --blob-1: #a58cff; --blob-2: #6fdcc3; --blob-3: #ffad8a; --blob-4: #7fb2ff;
    --on-grad: #ffffff;
    --glass: rgba(255, 255, 255, .52);
    --glass-strong: rgba(255, 255, 255, .72);
    --glass-hover: rgba(255, 255, 255, .7);
    --glass-edge: rgba(255, 255, 255, .85);
    --glass-line: rgba(80, 70, 140, .12);
    --shine: inset 0 1px 0 rgba(255, 255, 255, .9);
    --shadow: 0 8px 28px -12px rgba(60, 50, 130, .28);
    --fg: #1b1838; --fg-2: #4d4970; --fg-3: #7d7a9c;
    --accent: #6b55f0; --accent-2: #2fb5c9;
    --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
    --ring: #6b55f0;
    --warn-bg: rgba(255, 196, 120, .35); --warn-fg: #7a4a00;
    --blur: blur(18px) saturate(170%);
    --a0: #6b55f0; --a1: #0e9c7a; --a2: #e06a2c; --a3: #2f72e0; --a4: #c64688; --a5: #8c7c10;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --base: #0d0b1d;
    --blob-1: #5b3fd9; --blob-2: #0f7f86; --blob-3: #b23b7a; --blob-4: #2a4fbf;
    --glass: rgba(255, 255, 255, .06);
    --glass-strong: rgba(255, 255, 255, .1);
    --glass-hover: rgba(255, 255, 255, .11);
    --glass-edge: rgba(255, 255, 255, .16);
    --glass-line: rgba(255, 255, 255, .09);
    --shine: inset 0 1px 0 rgba(255, 255, 255, .14);
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
    --fg: #f3f1ff; --fg-2: #c3bfe0; --fg-3: #8e8ab0;
    --accent: #9d8bff; --accent-2: #4fd8e8; --ring: #b3a6ff; --on-grad: #120f2a;
    --warn-bg: rgba(255, 180, 90, .14); --warn-fg: #ffd08a;
    --a0: #b3a6ff; --a1: #5ee3bd; --a2: #ffa06b; --a3: #84b0ff; --a4: #ff8ec6; --a5: #e6d65e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font: 14px/1.45 var(--sans); color: var(--fg); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .glass { background: var(--glass); border: 1px solid var(--glass-edge);
           -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shine), var(--shadow); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --glass: rgba(255, 255, 255, .82); }
    :root[data-theme="dark"] { --glass: rgba(30, 27, 55, .9); }
  }

  /* Aurora backdrop that the glass frosts over */
  .app { position: relative; isolation: isolate; overflow: hidden; border-radius: 20px; background: var(--base); padding-bottom: 4px; }
  .app::before, .app::after { content: ""; position: absolute; z-index: -1; pointer-events: none; filter: blur(48px); opacity: .85; }
  .app::before { inset: -20% -10% auto -10%; height: 420px;
    background: radial-gradient(closest-side, var(--blob-1), transparent) 0% 30% / 55% 80% no-repeat,
                radial-gradient(closest-side, var(--blob-2), transparent) 85% 0% / 50% 70% no-repeat,
                radial-gradient(closest-side, var(--blob-3), transparent) 55% 90% / 45% 60% no-repeat;
    animation: drift 18s ease-in-out infinite alternate; }
  .app::after { inset: 45% -15% -10% -15%;
    background: radial-gradient(closest-side, var(--blob-4), transparent) 10% 60% / 50% 60% no-repeat,
                radial-gradient(closest-side, var(--blob-1), transparent) 95% 80% / 45% 55% no-repeat;
    animation: drift 24s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform: translate3d(4%, 3%, 0) scale(1.08); } }
  .fullscreen .app { border-radius: 0; min-height: 100vh; }

  /* Header */
  .top { margin: 12px 12px 10px; border-radius: 16px; padding: 12px 12px 10px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .mark { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center; color: #fff;
          background: var(--grad); box-shadow: 0 6px 18px -6px var(--accent), inset 0 1px 0 rgba(255,255,255,.45); }
  .title { min-width: 0; flex: 1; }
  .title b { font-weight: 700; letter-spacing: -0.015em; font-size: 15px; }
  .summary { color: var(--fg-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { border-radius: 10px; width: 32px; height: 32px; display: grid; place-items: center; color: var(--fg-2); flex: none; }
  .icon-btn:hover { background: var(--glass-hover); color: var(--fg); }

  .search { display: flex; gap: 8px; margin-bottom: 10px; }
  .search label { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 36px; border-radius: 12px;
                  background: var(--glass-strong); border: 1px solid var(--glass-edge); color: var(--fg-3); box-shadow: var(--shine); }
  .search label:focus-within { border-color: var(--ring); box-shadow: var(--shine), 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent); }
  .search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; color: var(--fg); }
  .search input::placeholder { color: var(--fg-3); }
  .search select { border: 1px solid var(--glass-edge); background: var(--glass-strong); border-radius: 12px; padding: 0 10px; height: 36px; color: var(--fg-2); box-shadow: var(--shine); }

  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; white-space: nowrap;
          border: 1px solid var(--glass-edge); background: var(--glass); color: var(--fg-2); font-size: 12.5px; box-shadow: var(--shine); }
  .chip:hover { background: var(--glass-hover); color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: var(--on-grad); font-weight: 600; box-shadow: 0 6px 16px -8px var(--accent); }
  .chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
  .chip .n { opacity: .7; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }

  .banner { margin: 0 12px 10px; padding: 9px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn-fg); font-size: 12.5px;
            border: 1px solid var(--glass-edge); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

  /* List: each mail is a glass card */
  .list { list-style: none; margin: 0; padding: 0 12px; display: flex; flex-direction: column; gap: 6px; }
  .row { border-radius: 14px; overflow: hidden; transition: transform .18s ease, background .18s ease; }
  .row:hover { background: var(--glass-hover); transform: translateY(-1px); }
  .row > button { all: unset; box-sizing: border-box; width: 100%; display: grid; cursor: pointer;
                  grid-template-columns: 36px 1fr auto; gap: 2px 12px; align-items: center; padding: 10px 12px; }
  .row > button:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; border-radius: 14px; }
  .row.open { background: var(--glass-strong); transform: none; }
  .avatar { grid-row: span 2; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
            font-size: 12.5px; font-weight: 700; color: #fff; letter-spacing: .02em;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 4px 12px -6px rgba(0,0,0,.4); }
  .from { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .when { color: var(--fg-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; justify-self: end; }
  .subject { color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tags { display: flex; gap: 4px; justify-self: end; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--fg-2); white-space: nowrap;
         background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 1px 8px 1px 7px; }
  .tag .dot { width: 6px; height: 6px; }
  .tag.dup { color: var(--fg-3); border-style: dashed; }

  .more { display: block; width: calc(100% - 24px); margin: 8px 12px 0; padding: 9px; border-radius: 12px; font-weight: 650;
          border: 1px dashed var(--glass-edge); background: transparent; color: var(--accent); }
  .more:hover { background: var(--glass); }

  /* Reading pane */
  .reader { padding: 0 12px 14px 60px; }
  .msg { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 12px; padding: 12px 14px; margin-top: 8px; box-shadow: var(--shine); }
  .msg-h { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--fg-3); margin-bottom: 8px; }
  .msg-h b { color: var(--fg); font-weight: 650; }
  .msg-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; max-height: 340px; overflow: auto; }
  .att { margin-top: 10px; font-size: 12px; color: var(--fg-2); display: inline-block; padding: 3px 9px; border-radius: 8px; background: var(--glass); border: 1px solid var(--glass-line); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
         border: 1px solid var(--glass-edge); background: var(--glass); color: var(--fg); box-shadow: var(--shine);
         -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); transition: transform .15s ease, background .15s ease; }
  .btn:hover { background: var(--glass-hover); transform: translateY(-1px); }
  .btn.primary { background: var(--grad); border-color: transparent; color: var(--on-grad); box-shadow: 0 8px 20px -10px var(--accent), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn:disabled { cursor: default; transform: none; opacity: .85; }
  .note { font-size: 12px; color: var(--fg-3); margin-top: 8px; }

  /* States */
  .empty { padding: 30px 16px; text-align: center; color: var(--fg-2); border-radius: 14px; }
  .skel { height: 58px; border-radius: 14px; padding: 11px 12px; display: grid; grid-template-columns: 36px 1fr; gap: 12px; }
  .skel i { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--glass), var(--glass-hover), var(--glass)); background-size: 200% 100%; animation: sh 1.4s infinite linear; }
  .skel i:first-child { border-radius: 12px; height: 36px; }
  @keyframes sh { to { background-position: -200% 0; } }

  .foot { display: flex; align-items: center; gap: 6px; padding: 12px 16px 10px; color: var(--fg-3); font-size: 11.5px; }
  .foot svg { flex: none; }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .app::before, .app::after, .skel i { animation: none; }
    .row, .btn { transition: none; }
    .row:hover, .btn:hover { transform: none; }
  }
  @media (max-width: 480px) {
    .reader { padding-left: 12px; }
    .tags .tag:not(:first-child) { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
 <div class="top glass">
  <div class="head">
    <div class="mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
    </div>
    <div class="title">
      <b>allinbox</b>
      <div class="summary" id="summary"></div>
    </div>
    <button class="icon-btn glass hidden" id="fs" type="button" aria-label="Fullscreen">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    </button>
  </div>
  <form class="search" id="search">
    <label>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false">
    </label>
    <select id="days" aria-label="Range">
      <option value="7">7d</option><option value="30">30d</option><option value="90">90d</option><option value="365">1y</option>
    </select>
  </form>
  <div class="chips" id="chips" role="toolbar"></div>
 </div>
  <div class="banner hidden" id="banner"></div>
  <ul class="list" id="list" aria-live="polite"></ul>
  <div class="foot">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <span id="foot"></span>
  </div>
</div>
<script>
(() => {
  'use strict';
  // ---------- i18n ----------
  const STR = {
    en: {
      searching: (n) => `Searching ${n ? n + ' inboxes' : 'every inbox'}…`,
      summary: (m, a) => `${m} message${m === 1 ? '' : 's'} · ${a} account${a === 1 ? '' : 's'}`,
      latest: 'latest', placeholder: 'Search all inboxes', all: 'All',
      empty: 'No messages found.', showAll: (n) => `Show all ${n}`,
      loading: 'Loading conversation…', also: 'also in',
      summarize: 'Summarize', draft: 'Draft reply', close: 'Close',
      draftNote: 'Claude writes the draft; allinbox can only save it to Drafts. It never sends.',
      sent: 'Asked Claude ✓', failed: (a) => `${a} failed`, foot: 'Read-only · never sends',
      askSummarize: (id) => `Summarize the email thread ${id} (use allinbox read_thread).`,
      askDraft: (id) => `Help me draft a reply to email ${id}. Read the thread first, show me the draft, and only save it to Drafts if I confirm.`,
      err: 'Could not load this conversation.', attachments: 'Attachments',
    },
    es: {
      searching: (n) => `Buscando en ${n ? n + ' casillas' : 'todas las casillas'}…`,
      summary: (m, a) => `${m} mensaje${m === 1 ? '' : 's'} · ${a} cuenta${a === 1 ? '' : 's'}`,
      latest: 'recientes', placeholder: 'Buscar en todas las casillas', all: 'Todas',
      empty: 'No se encontraron mensajes.', showAll: (n) => `Ver los ${n}`,
      loading: 'Cargando conversación…', also: 'también en',
      summarize: 'Resumir', draft: 'Borrador de respuesta', close: 'Cerrar',
      draftNote: 'Claude escribe el borrador; allinbox solo puede guardarlo en Borradores. Nunca envía.',
      sent: 'Pedido a Claude ✓', failed: (a) => `${a} falló`, foot: 'Solo lectura · nunca envía',
      askSummarize: (id) => `Resumí el hilo del mail ${id} (usá read_thread de allinbox).`,
      askDraft: (id) => `Ayudame con un borrador de respuesta al mail ${id}. Leé el hilo primero, mostrame el borrador y guardalo en Borradores solo si confirmo.`,
      err: 'No se pudo cargar la conversación.', attachments: 'Adjuntos',
    },
  };
  let lang = 'en';
  const t = (k, ...a) => { const v = STR[lang][k]; return typeof v === 'function' ? v(...a) : v; };

  // ---------- MCP Apps bridge (JSON-RPC 2.0 over postMessage) ----------
  const host = window.parent;
  let seq = 0;
  const pending = new Map();
  const post = (msg) => host.postMessage({ jsonrpc: '2.0', ...msg }, '*');
  const notify = (method, params = {}) => post({ method, params });
  const request = (method, params = {}) => new Promise((resolve, reject) => {
    const id = ++seq;
    pending.set(id, { resolve, reject });
    post({ id, method, params });
    setTimeout(() => { if (pending.delete(id)) reject(new Error('timeout')); }, 60000);
  });
  window.addEventListener('message', (e) => {
    if (e.source !== host) return;
    const m = e.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.method) {
      if (m.method === 'ui/notifications/tool-input') onInput(m.params?.arguments || {});
      else if (m.method === 'ui/notifications/tool-result') onResult(m.params || {});
      else if (m.method === 'ui/notifications/tool-cancelled') render();
      else if (m.method === 'ui/notifications/host-context-changed') applyContext(m.params || {});
      if (m.id !== undefined) post({ id: m.id, result: {} }); // ping, ui/resource-teardown
    } else if (m.id !== undefined && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id);
      m.error ? p.reject(new Error(m.error.message || 'error')) : p.resolve(m.result);
    }
  });

  let ctx = {};
  let caps = {};
  function applyContext(c) {
    ctx = { ...ctx, ...c };
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles?.variables;
    // Only the host's fonts: its flat colors would cancel the glass look.
    if (vars) for (const k of ['--font-sans', '--font-mono']) if (vars[k]) document.documentElement.style.setProperty(k, vars[k]);
    if (ctx.locale) lang = String(ctx.locale).toLowerCase().startsWith('es') ? 'es' : 'en';
    document.documentElement.lang = lang;
    document.body.classList.toggle('fullscreen', ctx.displayMode === 'fullscreen');
    $('fs').classList.toggle('hidden', !(ctx.availableDisplayModes || []).includes('fullscreen'));
    staticText();
    render();
  }

  // ---------- Parsing (the same text the model gets; never HTML) ----------
  const WRAP = /^<\/?untrusted_email_[0-9a-f]+[^>]*>$/;
  const textOf = (r) => (r.content || []).filter((c) => c.type === 'text').map((c) => c.text).join('\n');
  function unwrap(text) {
    const lines = text.split('\n');
    const start = lines.findIndex((l) => WRAP.test(l));
    const end = lines.findIndex((l, i) => i > start && /^<\/untrusted_email_[0-9a-f]+>$/.test(l));
    if (start < 0 || end < 0) return { inner: '', rest: lines };
    return { inner: lines.slice(start + 1, end).join('\n'), rest: lines.slice(end + 1) };
  }
  const HIT = /^(.+:\d+) \| (\d{4}-\d\d-\d\d \d\d:\d\d) \| (.*?) \| (.*)$/;
  function parseHits(text) {
    const { inner, rest } = unwrap(text);
    const hits = [];
    for (const line of inner.split('\n')) {
      const m = HIT.exec(line);
      if (!m) continue;
      let subject = m[4], alsoIn = [];
      const also = / \(also in ([^()]+)\)$/.exec(subject);
      if (also) { alsoIn = also[1].split(', '); subject = subject.slice(0, also.index); }
      const id = m[1];
      hits.push({ id, account: id.slice(0, id.lastIndexOf(':')), date: m[2].replace(' ', 'T') + 'Z', from: m[3], subject, alsoIn });
    }
    const errors = rest.map((l) => /^! (.+?) failed: (.*)$/.exec(l)).filter(Boolean).map((m) => ({ account: m[1], error: m[2] }));
    return { hits, errors };
  }
  function parseThread(text) {
    const { inner } = unwrap(text);
    const parts = inner.split(/^--- (.+:\d+) ---$/m);
    const chunks = parts.length > 1 ? parts.slice(1).reduce((a, p, i) => (i % 2 ? a[a.length - 1].push(p) : a.push([p]), a), []) : [[null, inner]];
    return chunks.map(([id, raw]) => {
      const body = raw.replace(/^\n+/, '');
      const split = body.indexOf('\n\n');
      const head = split < 0 ? body : body.slice(0, split);
      const h = {};
      for (const l of head.split('\n')) { const i = l.indexOf(': '); if (i > 0) h[l.slice(0, i)] = l.slice(i + 2); }
      return { id, from: h.From || '', date: h.Date || '', attachments: h.Attachments || '', body: split < 0 ? '' : body.slice(split + 2).trim() };
    });
  }

  // ---------- State ----------
  const S = { phase: 'idle', args: {}, hits: [], errors: [], filter: null, open: null, threads: {}, expanded: false };
  function onInput(args) { S.args = args; S.phase = 'loading'; S.open = null; syncForm(); render(); }
  function onResult(r) {
    if (r.isError) { S.hits = []; S.errors = [{ account: 'allinbox', error: textOf(r) }]; }
    else Object.assign(S, parseHits(textOf(r)));
    S.phase = 'done'; S.filter = null; S.open = null; S.threads = {}; S.expanded = false;
    render();
  }

  // ---------- Rendering (textContent only: email text can never become markup) ----------
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const accounts = () => [...new Set(S.hits.flatMap((h) => [h.account, ...h.alsoIn]))].sort();
  const colorOf = (acc) => `var(--a${Math.max(0, accounts().indexOf(acc)) % 6})`;
  const AVATARS = ['#5b6ee1', '#2f9e7a', '#d0702f', '#b5527f', '#3a8fb7', '#8a6bd1', '#6f8f2f', '#c2563f'];
  function hash(s) { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) | 0; return Math.abs(x); }
  const senderName = (from) => (from.replace(/<[^>]*>/, '').replace(/"/g, '').trim() || from.replace(/[<>]/g, '')).trim();
  const initials = (name) => (name.match(/[\p{L}\p{N}]+/gu) || ['?']).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
  function when(iso) {
    const d = new Date(iso); if (isNaN(d)) return '';
    const opts = ctx.timeZone ? { timeZone: ctx.timeZone } : {};
    const loc = ctx.locale || undefined;
    const now = new Date();
    const sameDay = d.toLocaleDateString(loc, opts) === now.toLocaleDateString(loc, opts);
    if (sameDay) return d.toLocaleTimeString(loc, { ...opts, hour: '2-digit', minute: '2-digit' });
    const sameYear = d.getUTCFullYear() === now.getUTCFullYear();
    return d.toLocaleDateString(loc, { ...opts, day: 'numeric', month: 'short', ...(sameYear ? {} : { year: 'numeric' }) });
  }

  function staticText() {
    $('q').placeholder = t('placeholder');
    $('foot').textContent = t('foot');
  }
  function syncForm() {
    $('q').value = S.args.query || '';
    const d = String(S.args.since_days || 30);
    if (![...$('days').options].some((o) => o.value === d)) $('days').add(new Option(d + 'd', d));
    $('days').value = d;
  }

  function render() {
    const list = $('list'); list.replaceChildren();
    const chips = $('chips'); chips.replaceChildren();
    const banner = $('banner');
    banner.classList.toggle('hidden', !S.errors.length);
    banner.textContent = S.errors.map((e) => `⚠ ${t('failed', e.account)}: ${e.error}`).join('  ·  ');

    if (S.phase === 'loading' || S.phase === 'idle') {
      $('summary').textContent = t('searching', (S.args.accounts || []).length);
      for (let i = 0; i < 4; i++) { const s = el('li', 'skel glass'); s.append(el('i'), el('i')); list.append(s); }
      return resize();
    }
    const accs = accounts();
    const q = S.args.query ? `“${S.args.query}”` : t('latest');
    $('summary').textContent = `${t('summary', S.hits.length, accs.length)} · ${q} · ${S.args.since_days || 30}d`;

    if (accs.length > 1) {
      const chip = (label, acc, n) => {
        const b = el('button', 'chip'); b.type = 'button';
        b.setAttribute('aria-pressed', String(S.filter === acc));
        if (acc) { const d = el('span', 'dot'); d.style.background = colorOf(acc); b.append(d); }
        b.append(el('span', null, label), el('span', 'n', String(n)));
        b.onclick = () => { S.filter = acc; S.expanded = false; render(); };
        chips.append(b);
      };
      chip(t('all'), null, S.hits.length);
      for (const a of accs) chip(a, a, S.hits.filter((h) => h.account === a || h.alsoIn.includes(a)).length);
    }

    const shown = S.hits.filter((h) => !S.filter || h.account === S.filter || h.alsoIn.includes(S.filter));
    if (!shown.length) { list.append(el('li', 'empty glass', t('empty'))); return resize(); }
    const LIMIT = 8;
    const fullscreen = ctx.displayMode === 'fullscreen';
    const visible = S.expanded || fullscreen ? shown : shown.slice(0, LIMIT);
    for (const h of visible) list.append(row(h));
    if (visible.length < shown.length) {
      const li = el('li'); const b = el('button', 'more', t('showAll', shown.length)); b.type = 'button';
      b.onclick = () => { S.expanded = true; render(); };
      li.append(b); list.append(li);
    }
    resize();
  }

  function row(h) {
    const li = el('li', 'row glass' + (S.open === h.id ? ' open' : ''));
    const b = el('button'); b.type = 'button'; b.setAttribute('aria-expanded', String(S.open === h.id));
    const name = senderName(h.from);
    const av = el('span', 'avatar', initials(name));
    av.style.background = AVATARS[hash(name) % AVATARS.length];
    av.setAttribute('aria-hidden', 'true');
    const tags = el('span', 'tags');
    const tag = el('span', 'tag'); const dot = el('span', 'dot'); dot.style.background = colorOf(h.account);
    tag.append(dot, h.account); tags.append(tag);
    if (h.alsoIn.length) { const d = el('span', 'tag dup', `+${h.alsoIn.length}`); d.title = `${t('also')} ${h.alsoIn.join(', ')}`; tags.append(d); }
    b.title = h.from;
    b.append(av, el('span', 'from', name), el('span', 'when', when(h.date)), el('span', 'subject', h.subject), tags);
    b.onclick = () => toggle(h.id);
    li.append(b);
    if (S.open === h.id) li.append(reader(h));
    return li;
  }

  function reader(h) {
    const box = el('div', 'reader');
    const th = S.threads[h.id];
    if (!th) box.append(el('div', 'note', t('loading')));
    else if (th.error) box.append(el('div', 'note', t('err') + ' ' + th.error));
    else for (const m of th.messages) {
      const card = el('div', 'msg');
      const head = el('div', 'msg-h');
      head.append(el('b', null, senderName(m.from) || h.from), el('span', null, when(m.date)));
      card.append(head, el('div', 'msg-body', m.body));
      if (m.attachments) card.append(el('div', 'att', `📎 ${t('attachments')}: ${m.attachments}`));
      box.append(card);
    }
    const actions = el('div', 'actions');
    const ask = (label, cls, text) => {
      const b = el('button', 'btn' + cls, label); b.type = 'button';
      b.onclick = async () => {
        b.disabled = true;
        try { const r = await request('ui/message', { role: 'user', content: [{ type: 'text', text }] }); b.textContent = r?.isError ? '✕' : t('sent'); }
        catch { b.textContent = '✕'; }
      };
      return b;
    };
    actions.append(ask(t('summarize'), ' primary', t('askSummarize', h.id)), ask(t('draft'), '', t('askDraft', h.id)));
    const close = el('button', 'btn', t('close')); close.type = 'button'; close.onclick = () => toggle(h.id);
    actions.append(close);
    box.append(actions, el('div', 'note', t('draftNote')));
    return box;
  }

  async function toggle(id) {
    S.open = S.open === id ? null : id;
    render();
    if (!S.open || S.threads[id]) return;
    try {
      const r = await request('tools/call', { name: 'read_thread', arguments: { id, max_chars: 8000 } });
      S.threads[id] = r.isError ? { error: textOf(r) } : { messages: parseThread(textOf(r)) };
    } catch (e) { S.threads[id] = { error: e.message }; }
    if (S.open === id) render();
  }

  $('search').addEventListener('submit', async (e) => {
    e.preventDefault();
    const args = { query: $('q').value.trim() || undefined, since_days: Number($('days').value), limit: 50 };
    onInput(args);
    try { onResult(await request('tools/call', { name: 'search_all', arguments: args })); }
    catch (err) { onResult({ isError: true, content: [{ type: 'text', text: err.message }] }); }
  });
  $('days').addEventListener('change', () => $('search').requestSubmit());
  $('fs').addEventListener('click', async () => {
    const mode = ctx.displayMode === 'fullscreen' ? 'inline' : 'fullscreen';
    try { const r = await request('ui/request-display-mode', { mode }); applyContext({ displayMode: r?.mode || mode }); } catch {}
  });

  let lastH = 0;
  function resize() {
    requestAnimationFrame(() => {
      const h = Math.ceil(document.getElementById('app').getBoundingClientRect().height);
      if (h !== lastH) { lastH = h; notify('ui/notifications/size-changed', { height: h }); }
    });
  }
  new ResizeObserver(resize).observe(document.getElementById('app'));

  staticText();
  render();
  request('ui/initialize', {
    appInfo: { name: 'allinbox', version: '__VERSION__' },
    appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
    protocolVersion: '2026-01-26',
  }).then((r) => {
    caps = r?.hostCapabilities || {};
    $('search').classList.toggle('hidden', !caps.serverTools); // re-search needs the host to proxy tools
    applyContext(r?.hostContext || {});
    notify('ui/notifications/initialized');
  }).catch(() => {});
})();
</script>
</body>
</html>
