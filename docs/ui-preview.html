<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>allinbox · MCP Apps preview</title>
<style>
  :root { color-scheme: light; --page: #f4f3ee; --ink: #1f1e1d; --soft: #6b6a66; --line: #e2e0d9; --bubble: #ffffff; }
  body.dark { color-scheme: dark; --page: #1f1e1d; --ink: #f2f1ed; --soft: #a6a49d; --line: #3d3d3a; --bubble: #2b2a28; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 17px; margin: 0; flex: 1; }
  .toggles button { font: inherit; border: 1px solid var(--line); background: var(--bubble); color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .user { margin: 18px 0 10px auto; max-width: 80%; width: fit-content; background: var(--bubble); border: 1px solid var(--line); padding: 8px 12px; border-radius: 14px; }
  .tool { color: var(--soft); font-size: 12.5px; margin: 6px 0; font-family: ui-monospace, monospace; }
  iframe { width: 100%; border: 0; display: block; height: 120px; }
  .log { margin-top: 8px; font-size: 12.5px; color: var(--soft); }
  .log div { padding: 4px 0; border-top: 1px dashed var(--line); }
  .note { color: var(--soft); font-size: 12.5px; margin-top: 30px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>allinbox · MCP Apps preview</h1>
    <span class="toggles"><button id="theme">Dark</button> <button id="lang">English</button></span>
  </header>

  <div class="user" data-es="¿Qué tengo pendiente esta semana en todos mis mails?" data-en="What do I have pending this week across all my email?"></div>
  <div class="tool">search_all({ since_days: 14 })</div>
  <iframe id="search" title="search_all view"></iframe>
  <div class="log" id="search-log"></div>

  <div class="user" data-es="Respondele a Martín que el martes me viene bien." data-en="Reply to Martín that Tuesday works for me."></div>
  <div class="tool">create_draft({ account: "personal", reply_to_id: "personal:3302", … })</div>
  <iframe id="draft" title="create_draft view"></iframe>
  <div class="log" id="draft-log"></div>

  <p class="note" data-es="Mock host: datos de ejemplo, nada se conecta a una casilla real. Abrí un mail, filtrá por cuenta, editá el borrador y guardalo." data-en="Mock host: sample data, nothing touches a real mailbox. Open an email, filter by account, edit the draft and save it."></p>
</main>

column: 2 / 4; display: flex; gap: 6px; align-items: center; min-width: 0; }\n.subject .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }\n.acc { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; flex: none; }\n.also { font-size: 11px; color: var(--muted); flex: none; }\n.reader { padding: 4px 14px 12px 18px; background: var(--bg-soft); }\n.reader .hdr { font-size: 12px; color: var(--muted); white-space: pre-wrap; margin: 0 0 8px; }\n.reader .body { font-family: var(--font); white-space: pre-wrap; word-break: break-word; margin: 0; max-height: 340px; overflow: auto; font-size: 13.5px; }\n.reader .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }\n.empty { padding: 18px 14px; color: var(--muted); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"card\" id=\"app\">\u003cdiv class=\"skeleton\">\u003cspan class=\"spinner\">\u003c/span> \u003cspan id=\"loading\">Searching every inbox…\u003c/span>\u003c/div>\u003c/div>\n\u003cscript>\n// Minimal MCP Apps bridge (spec 2026-01-26), zero dependencies.\n// The server inlines this file into each view (see src/ui.ts), so every view stays one self-contained HTML.\n// Everything shown in the views comes from email: render it with textContent only, never as markup.\nconst bridge = (() => {\n  let nextId = 1;\n  const pending = new Map();\n  const handlers = {};\n  let hostContext = {};\n\n  const post = (msg) => window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*');\n\n  window.addEventListener('message', (event) => {\n    if (event.source !== window.parent) return;\n    const m = event.data;\n    if (!m || m.jsonrpc !== '2.0') return;\n\n    if (m.id !== undefined && !m.method) {\n      const p = pending.get(m.id);\n      if (!p) return;\n      pending.delete(m.id);\n      m.error ? p.reject(new Error(m.error.message ?? 'Host error')) : p.resolve(m.result);\n      return;\n    }\n    if (m.method === 'ui/notifications/host-context-changed') {\n      hostContext = { ...hostContext, ...m.params };\n      applyHostStyles();\n    }\n    const handler = handlers[m.method];\n    if (m.id === undefined) {\n      handler?.(m.params ?? {});\n      return;\n    }\n    if (m.method === 'ui/resource-teardown') {\n      post({ id: m.id, result: {} });\n      return;\n    }\n    if (!handler) {\n      post({ id: m.id, error: { code: -32601, message: `Method not found: ${m.method}` } });\n      return;\n    }\n    Promise.resolve()\n      .then(() => handler(m.params ?? {}))\n      .then(\n        (result) => post({ id: m.id, result: result ?? {} }),\n        (err) => post({ id: m.id, error: { code: -32000, message: String(err?.message ?? err) } }),\n      );\n  });\n\n  const request = (method, params) =>\n    new Promise((resolve, reject) => {\n      const id = nextId++;\n      pending.set(id, { resolve, reject });\n      post({ id, method, params });\n    });\n  const notify = (method, params = {}) => post({ method, params });\n\n  function applyHostStyles() {\n    const root = document.documentElement;\n    if (hostContext.theme) root.dataset.theme = hostContext.theme;\n    for (const [name, value] of Object.entries(hostContext.styles?.variables ?? {})) {\n      if (typeof value === 'string' && name.startsWith('--')) root.style.setProperty(name, value);\n    }\n  }\n\n  async function connect(name) {\n    const result = await request('ui/initialize', {\n      protocolVersion: '2026-01-26',\n      clientInfo: { name, version: '0.4.0' },\n      appCapabilities: {},\n    });\n    hostContext = result?.hostContext ?? {};\n    applyHostStyles();\n    notify('ui/notifications/initialized');\n    // The host sizes the frame to fit us, so any scroll offset is an accident (focus, scrollIntoView). Pin to the top\n    // unless the content really is taller than the frame (a host that caps the height).\n    window.addEventListener('scroll', () => {\n      if (window.scrollY && document.body.getBoundingClientRect( elContext: (text) => request('ui/update-model-context', { content: [{ type: 'text', text }] }),\n    get hostContext() {\n      return hostContext;\n    },\n  };\n})();\n\u003c/script>\n\u003cscript>\nconst PALETTE = ['#3b6fd8', '#d9822b', '#2e9b6a', '#a855c7', '#d1495b', '#0e9aa7', '#8a7a2a', '#5a6acf'];\nconst t = (en, es) => (bridge.es() ? es : en);\nconst app = document.getElementById('app');\nconst state = { query: '', data: null, hidden: new Set(), open: null };\n\nconst el = (tag, props = {}, ...children) => {\n  const node = Object.assign(document.createElement(tag), props);\n  for (const c of children) if (c != null) node.append(c);\n  return node;\n};\nconst colorOf = (account) => {\n  const ids = state.data?.accounts?.map((a) => a.id) ?? [];\n  const i = Math.max(0, ids.indexOf(account));\n  return PALETTE[i % PALETTE.length];\n};\nconst nameOf = (from) => (from.match(/^\\s*\"?([^\"\u003c]+?)\"?\\s*\u003c/)?.[1] ?? from).trim();\nfunction when(iso) {\n  const d = new Date(iso);\n  if (Number.isNaN(+d)) return '';\n  const loc = bridge.hostContext.locale ?? undefined;\n  const now = new Date();\n  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString(loc, { hour: '2-digit', minute: '2-digit' });\n  if (now - d \u003c 6 * 864e5) return d.toLocaleDateString(loc, { weekday: 'short' });\n  return d.toLocaleDateString(loc, { day: 'numeric', month: 'short' });\n}\n\n/** Prefer the structured payload in _meta (the model never sees it); fall back to the text lines. */\nfunction readResult(result) {\n  const ui = result?._meta?.['allinbox/ui'] ?? result?.structuredContent;\n  if (ui?.hits) return ui;\n  const hits = bridge\n    .unwrap(bridge.textOf(result))\n    .split('\\n')\n    .map((line) => line.split(' | '))\n    .filter((p) => p.length >= 4 && /:\\d+$/.test(p[0]))\n    .map(([id, date, from, ...rest]) => ({ id, account: id.slice(0, id.lastIndexOf(':')), date: date.replace(' ', 'T'), from, subject: rest.join(' | ') }));\n  const accounts = [...new Set(hits.map((h) => h.account))].map((id) => ({ id }));\n  return { hits, accounts, errors: [] };\n}\n\nfunction render() {\n  const d = state.data;\n  app.replaceChildren();\n  const visible = d.hits.filter((h) => !state.hidden.has(h.account));\n  const nAcc = d.accounts.length - d.errors.length;\n  app.append(\n    el('div', { className: 'head' },\n      el('span', { className: 'title', textContent: state.query ? `“${state.query}”` : t('Latest mail', 'Últimos mails') }),\n      el('span', { className: 'sub', textContent: t(`${d.hits.length} messages · ${nAcc} of ${d.accounts.length} inboxes`, `${d.hits.length} mensajes · ${nAcc} de ${d.accounts.length} casillas`) }),\n    ),\n  );\n  if (d.accounts.length > 1) {\n    const filters = el('div', { className: 'filters' });\n    for (const a of d.accounts) {\n      const n = d.hits.filter((h) => h.account === a.id).length;\n      const chip = el('button', { className: 'chip', title: a.email ?? a.id }, el('span', { className: 'dot' }), `${a.id} · ${n}`);\n      chip.querySelector('.dot').style.background = colorOf(a.id);\n      chip.setAttribute('aria-pressed', String(!state.hidden.has(a.id)));\n      chip.onclick = () => {\n        state.hidden.has(a.id) ? state.hidden.delete(a.id) : state.hidden.add(a.id);\n        render();\n      };\n      filters.append(chip);\n    }\n    app.append(filters);\n  }\n  for (const e of d.errors) {\n    app.append(el('div', { className: 'banner', textContent: t(`${e.account} didn't answer: ${e.error}`, `${e.account} no respondió: ${e.error}`) }));\n  }\n  if (!visible.length) {\n    app.append(el('div', { className: 'empty', textContent: t('No messages found.', 'No se encontraron mensajes.') }));\n    return;\n  }\n  const list = el('ul', { className: 'list' });\n  for (const h of visible) list.append(row(h));\n  app.append(list);\n}\n\nfunction row(h) {\n  const li = el('li', { className: 'row' + (state.open?.id === h.id ? ' open' : '') });\n  const color = colorOf(h.account);\n  const bar = el('span', { className: 'bar' });\n  bar.style.background = color;\n  const acc = el('span', { className: 'acc', textContent: h.account });\n  acc.style.background = `color-mix(in srgb, ${color} 16%, transparent)`;\n  acc.style.color = color;\n  const line = el('button', { className: 'line' },\n    bar,\n    el('span', { className: 'from', textContent: nameOf(h.from), title: h.from }),\n    el('span', { className: 'date', textContent: when(h.date) }),\n    el('span', { className: 'subject' },\n      acc,\n      el('span', { className: 's', textContent: h.subject }),\n      h.alsoIn?.length ? el('span', { className: 'also', textContent: t(`also in ${h.alsoIn.join(', ')}`, `también en ${h.alsoIn.join(', ')}`) }) : null,\n    ),\n  );\n  line.onclick = () => toggle(h);\n  li.append(line);\n  if (state.open?.id === h.id) li.append(reader(h));\n  return li;\n}\n\nfunction reader(h) {\n  const box = el('div', { className: 'reader' });\n  const o = state.open;\n  if (o.loading) {\n    box.append(el('div', { className: 'muted' }, el('span', { className: 'spinner' }), ' ', t('Reading…', 'Leyendo…')));\n    return box;\n  }\n  if (o.error) {\n    box.append(el('div', { className: 'banner', textContent: o.error }));\n    return box;\n  }\n  const [head, ...rest] = o.text.split('\\n\\n');\n  box.append(el('pre', { className: 'hdr', textContent: head }), el('pre', { className: 'body', textContent: rest.join('\\n\\n') }));\n  const actions = el('div', { className: 'actions' });\n  if (o.kind !== 'thread') {\n    actions.append(el('button', { textContent: t('Whole thread', 'Ver hilo completo'), onclick: () => load(h, 'thread') }));\n  }\n  if (state.data.drafts) {\n    actions.append(el('button', {\n      className: 'primary',\n      textContent: t('Draft a reply', 'Borrador de respuesta'),\n      onclick: (ev) => {\n        ev.target.disabled = true;\n        bridge.sendMessage(t(`Draft a reply to email ${h.id} (“${h.subject}”).`, `Armá un borrador de respuesta al mail ${h.id} (“${h.subject}”).`));\n      },\n    }));\n  }\n  if (actions.childElementCount) box.append(actions);\n  return box;\n}\n\nfunction toggle(h) {\n  if (state.open?.id === h.id) {\n    state.open = null;\n    render();\n    return;\n  }\n  load(h, 'email');\n}\n\nasync function load(h, kind) {\n  state.open = { id: h.id, kind, loading: true };\n  render();\n  try {\n    const tool = kind === 'thread' ? 'read_thread' : 'read_email';\n    const result = await bridge.callTool(tool, { id: h.id });\n    if (state.open?.id !== h.id) return;\n    state.open = { id: h.id, kind, text: bridge.unwrap(bridge.textOf(result)) };\n  } catch (e) {\n    if (state.open?.id !== h.id) return;\n    state.open = { id: h.id, kind, error: String(e.message ?? e) };\n  }\n  render();\n}\n\nbridge.on('ui/notifications/tool-input', (p) => {\n  state.query = p.arguments?.query ?? '';\n});\nbridge.on('ui/notifications/tool-result', (result) => {\n  if (result.isError) {\n    app.replaceChildren(el('div', { className: 'banner', textContent: bridge.unwrap(bridge.textOf(result)) }));\n    return;\n  }\n  state.data = readResult(result);\n  state.data.errors ??= [];\n  state.query ||= state.data.query ?? '';\n  render();\n});\nbridge.on('ui/notifications/tool-cancelled', () => {\n  app.replaceChildren(el('div', { className: 'empty', textContent: t('Search cancelled.', 'Búsqueda cancelada.') }));\n});\n\nbridge.connect('allinbox-search').then(() => {\n  document.getElementById('loading').textContent = t('Searching every inbox…', 'Buscando en todas tus casillas…');\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","draft":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\u003ctitle>allinbox · draft review\u003c/title>\n\u003cstyle>\n/* Shared by every view. Host variables (MCP Apps hostContext.styles) win; these are fallbacks. */\n:root {\n  --bg: var(--color-background-primary, #ffffff);\n  --bg-soft: var(--color-background-secondary, #f6f6f4);\n  --text: var(--color-text-primary, #1f1e1d);\n  --muted: var(--color-text-secondary, #6b6a66);\n  --border: var(--color-border-primary, #e4e2dc);\n  --accent: #3b6fd8;\n  --danger: #c2412d;\n  --ok: #2e7d4f;\n  --radius: var(--border-radius-md, 10px);\n  --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif);\n  color-scheme: light dark;\n}\n:root[data-theme='dark'] {\n  --bg: var(--color-background-primary, #262624);\n  --bg-soft: var(--color-background-secondary, #30302e);\n  --text: var(--color-text-primary, #f2f1ed);\n  --muted: var(--color-text-secondary, #a6a49d);\n  --border: var(--color-border-primary, #3d3d3a);\n  --accent: #7ea4f0;\n  --danger: #f08a77;\n  --ok: #7ccf9d;\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: transparent; }\nbody { display: flow-root; }\nbody { font: 14px/1.45 var(--font); color: var(--text); }\n.card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }\n.head { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 8px; flex-wrap: wrap; }\n.title { font-weight: 600; font-size: 15px; }\n.sub { color: var(--muted); font-size: 12.5px; }\n.muted { color: var(--muted); }\nbutton { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 6px 12px; }\nbutton:hover:not(:disabled) { background: var(--bg-soft); }\nbutton:disabled { opacity: 0.5; cursor: default; }\nbutton.primary { background: var(--accent); border-color: var(--accent); color: #fff; }\nbutton.primary:hover:not(:disabled) { filter: brightness(1.05); background: var(--accent); }\n.banner { margin: 0 14px 10px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }\n.banner.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }\n.footnote { padding: 8px 14px 12px; color: var(--muted); font-size: 12px; }\n.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--border); white-space: nowrap; }\n.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }\n.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; }\n@keyframes spin { to { transform: rotate(360deg); } }\n.skeleton { padding: 18px 14px; color: var(--muted); }\n\n.badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 7px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }\n.badge.saved { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }\n.badge.gone { background: var(--bg-soft); color: var(--muted); }\nform { border-top: 1px solid var(--border); }\n.field { display: grid; grid-template-columns: 64px 1fr; align-items: start; gap: 8px; padding: 7px 14px; border-bottom: 1px solid var(--border); }\n.field label { color: var(--muted); font-size: 12.5px; padding-top: 5px; }\n.field .static { padding-top: 4px; overflow-wrap: anywhere; }\ninput, textarea { width: 100%; font: inherit; color: var(--text); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; outline: none; }\ninput:focus, textarea:focus { border-color: var(--accent); background: var(--bg); }\ninput:disabled, textarea:disabled { color: var(--text); }\ntextarea { resize: none; min-height: 120px; line-height: 1.5; }\n.bodywrap { padding: 8px 14px; border-bottom: 1px solid var(--border); }\n.warn { grid-column: 2; font-size: 12px; color: var(--danger); margin-top: -2px; }\n.actions { display: flex; gap: 8px; padding: 10px 14px 4px; align-items: center; flex-wrap: wrap; }\n.actions .grow { flex: 1; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"card\" id=\"app\">\u003cdiv class=\"skeleton\">\u003cspan class=\"spinner\">\u003c/span> \u003cspan id=\"loading\">Preparing the draft…\u003c/span>\u003c/div>\u003c/div>\n\u003cscript>\n// Minimal MCP Apps bridge (spec 2026-01-26), zero dependencies.\n// The server inlines this file into each view (see src/ui.ts), so every view stays one self-contained HTML.\n// Everything shown in the views comes from email: render it with textContent only, never as markup.\nconst bridge = (() => {\n  let nextId = 1;\n  const pending = new Map();\n  const handlers = {};\n  let hostContext = {};\n\n  const post = (msg) => window.parent.postMessage({ jsonrpc: '2.0', ...msg }, '*');\n\n  window.addEventListener('message', (event) => {\n    if (event.source !== window.parent) return;\n    const m = event.data;\n    if (!m || m.jsonrpc !== '2.0') return;\n\n    if (m.id !== undefined && !m.method) {\n      const p = pending.get(m.id);\n      if (!p) return;\n      pending.delete(m.id);\n      m.error ? p.reject(new Error(m.error.message ?? 'Host error')) : p.resolve(m.result);\n      return;\n    }\n    if (m.method === 'ui/notifications/host-context-changed') {\n      hostContext = { ...hostContext, ...m.params };\n      applyHostStyles();\n    }\n    const handler = handlers[m.method];\n    if (m.id === undefined) {\n      handler?.(m.params ?? {});\n      return;\n    }\n    if (m.method === 'ui/resource-teardown') {\n      post({ id: m.id, result: {} });\n      return;\n    }\n    if (!handler) {\n      post({ id: m.id, error: { code: -32601, message: `Method not found: ${m.method}` } });\n      return;\n    }\n    Promise.resolve()\n      .then(() => handler(m.params ?? {}))\n      .then(\n        (result) => post({ id: m.id, result: result ?? {} }),\n        (err) => post({ id: m.id, error: { code: -32000, message: String(err?.message ?? err) } }),\n      );\n  });\n\n  const request = (method, params) =>\n    new Promise((resolve, reject) => {\n      const id = nextId++;\n      pending.set(id, { resolve, reject });\n      post({ id, method, params });\n    });\n  const notify = (method, params = {}) => post({ method, params });\n\n  function applyHostStyles() {\n    const root = document.documentElement;\n    if (hostContext.theme) root.dataset.theme = hostContext.theme;\n    for (const [name, value] of Object.entries(hostContext.styles?.variables ?? {})) {\n      if (typeof value === 'string' && name.startsWith('--')) root.style.setProperty(name, value);\n    }\n  }\n\n  async function connect(name) {\n    const result = await request('ui/initialize', {\n      protocolVersion: '2026-01-26',\n      clientInfo: { name, version: '0.4.0' },\n      appCapabilities: {},\n    });\n    hostContext = result?.hostContext ?? {};\n    applyHostStyles();\n    notify('ui/notifications/initialized');\n    // The host sizes the frame to fit us, so any scroll offset is an accident (focus, scrollIntoView). Pin to the top\n    // unless the content really is taller than the frame (a host that caps the height).\n    window.addEventListener('scroll', () => {\n      if (window.scrollY && document.body.getBoundingClientRect().height \u003c= window.innerHeight + 2) window.scrollTo(0, 0);\n    });\n    let last = '';\n    new ResizeObserver(() => {\n      // Measure the content, not the document: scrollHeight never drops below the frame's current height,\n      // so a card that collapses (closing an email, saving a draft) would never shrink back.\n      const rect = document.body.getBoundingClientRect();\n      const size = { width: Math.ceil(rect.width), height: Math.ceil(rect.height) };\n      const key = `${size.width}x${size.height}`;\n      if (key !== last) {\n        last = key;\n        notify('ui/notifications/size-changed', size);\n        // Content that grew before the host resized the frame can leave it scrolled; the host fits us, so reset.\n        requestAnimationFrame(() => window.scrollTo(0, 0));\n      }\n    }).observe(document.body);\n    return hostContext;\n  }\n\n  /** Call a tool on the allinbox server through the host. Throws on isError. */\n  async function callTool(name, args) {\n    const result = await request('tools/call', { name, arguments: args });\n    if (result?.isError) throw new Error(textOf(result) || 'Tool failed');\n    return result;\n  }\n\n  const textOf = (result) =>\n    (result?.content ?? [])\n      .filter((c) => c.type === 'text')\n      .map((c) => c.text)\n      .join('\\n');\n\n  /** Strip allinbox's \u003cuntrusted_email_NONCE> wrapper: the view shows plain text, never markup. */\n  const unwrap = (text) =>\n    text\n      .split('\\n')\n      .filter((l) => !/^\u003c\\/?untrusted_email_[0-9a-f]+/.test(l) && !l.startsWith('Reminder: content above'))\n      .join('\\n')\n      .trim();\n\n  const es = () => String(hostContext.locale ?? navigator.language ?? 'en').toLowerCase().startsWith('es');\n\n  return {\n    connect,\n    callTool,\n    textOf,\n    unwrap,\n    es,\n    on: (method, fn) => (handlers[method] = fn),\n    sendMessage: (text) => request('ui/message', { role: 'user', content: { type: 'text', text } }),\n    updateModelContext: (text) => request('ui/update-model-context', { content: [{ type: 'text', text }] }),\n    get hostContext() {\n      return hostContext;\n    },\n  };\n})();\n\u003c/script>\n\u003cscript>\nconst t = (en, es) => (bridge.es() ? es : en);\nconst app = document.getElementById('app');\nconst state = { draft: null, status: 'editing', error: '', folder: '' };\n\nconst el = (tag, props = {}, ...children) => {\n  const node = Object.assign(document.createElement(tag), props);\n  for (const c of children) if (c != null) node.append(c);\n  return node;\n};\nconst splitList = (s) => s.split(/[,;\\s]+/).map((x) => x.trim()).filter(Boolean);\n\n/** Mirror of drafts.ts blockedRecipients, only for instant feedback. The server re-checks on save. */\nfunction blocked(recipients, allow) {\n  const rules = (allow ?? []).map((r) => r.trim().toLowerCase());\n  if (rules.includes('*')) return [];\n  return recipients.filter((raw) => {\n    const r = raw.toLowerCase();\n    return !rules.some((rule) => (rule.startsWith('@') ? r.endsWith(rule) : r === rule));\n  });\n}\n\nfunction fromResult(result, args) {\n  const ui = result?._meta?.['allinbox/ui'] ?? {};\n  return {\n    mode: ui.mode ?? 'saved',\n    account: ui.account ?? args.account,\n    from: ui.from ?? '',\n    to: ui.to ?? args.to ?? [],\n    cc: ui.cc ?? args.cc ?? [],\n    subject: ui.subject ?? args.subject ?? '',\n    body: ui.body ?? args.body ?? '',\n    replyToId: ui.replyToId ?? args.reply_to_id,\n    allow: ui.allow ?? ['*'],\n    folder: ui.folder ?? '',\n  };\n}\n\nfunction badge() {\n  const map = {\n    editing: ['', t('Not saved yet', 'Sin guardar')],\n    saving: ['', t('Saving…', 'Guardando…')],\n    saved: ['saved', t('In Drafts · not sent', 'En Borradores · no enviado')],\n    discarded: ['gone', t('Discarded', 'Descartado')],\n  };\n  const [cls, label] = map[state.status];\n  return el('span', { className: 'badge ' + cls, textContent: label });\n}\n\nfunction render() {\n  const d = state.draft;\n  const locked = state.status !== 'editing';\n  let saveBtn = null;\n  app.replaceChildren(\n    el('div', { className: 'head' },\n      el('span', { className: 'title', textContent: d.replyToId ? t('Reply draft', 'Borrador de respuesta') : t('New draft', 'Borrador nuevo') }),\n      badge(),\n    ),\n  );\n\n  const form = el('form');\n  form.onsubmit = (e) => e.preventDefault();\n  form.append(el('div', { className: 'field' }, el('label', { textContent: t('From', 'De') }), el('div', { className: 'static', textContent: d.from ? `${d.from} (${d.account})` : d.account })));\n\n  const recipientField = (key, label) => {\n    const input = el('input', { value: d[key].join(', '), disabled: locked, placeholder: key === 'cc' ? t('optional', 'opcional') : '' });\n    const warn = el('div', { className: 'warn' });\n    const check = () => {\n      d[key] = splitList(input.value);\n      const bad = blocked(d[key], d.allow);\n      warn.textContent = bad.length ? t(`Not in your allowed recipients: ${bad.join(', ')}`, `Fuera de tus destinatarios permitidos: ${bad.join(', ')}`) : '';\n      saveBtn && (saveBtn.disabled = !canSave());\n    };\n    input.oninput = check;\n    queueMicrotask(check);\n    return el('div', { className: 'field' }, el('label', { textContent: label }), el('div', {}, input, warn));\n  };\n  form.append(recipientField('to', t('To', 'Para')));\n  if (d.cc.length || !locked) form.append(recipientField('cc', 'Cc'));\n\n  const subject = el('input', {\n    value: d.subject,\n    disabled: locked,\n    placeholder: d.replyToId ? t('Re: original subject', 'Re: asunto original') : '',\n    oninput: () => { d.subject = subject.value; saveBtn && (saveBtn.disabled = !canSave()); },\n  });\n  form.append(el('div', { className: 'field' }, el('label', { textContent: t('Subject', 'Asunto') }), subject));\n\n  const body = el('textarea', { value: d.body, disabled: locked });\n  const grow = () => { body.style.height = 'auto'; body.style.height = body.scrollHeight + 2 + 'px'; };\n  body.oninput = () => { d.body = body.value; grow(); saveBtn && (saveBtn.disabled = !canSave()); };\n  form.append(el('div', { className: 'bodywrap' }, body));\n  app.append(form);\n  requestAnimationFrame(grow);\n\n  if (state.error) app.append(el('div', { className: 'banner', style: 'margin-top:10px', textContent: state.error }));\n\n  if (state.status === 'editing' || state.status === 'saving') {\n    saveBtn = el('button', { className: 'primary', textContent: state.status === 'saving' ? t('Saving…', 'Guardando…') : t('Save to Drafts', 'Guardar en Borradores'), onclick: save });\n    saveBtn.disabled = state.status === 'saving' || !canSave();\n    app.append(el('div', { className: 'actions' },\n      saveBtn,\n      el('button', { textContent: t('Discard', 'Descartar'), disabled: state.status === 'saving', onclick: discard }),\n      el('span', { className: 'grow' }),\n    ));\n  }\n  if (state.status === 'saved') {\n    app.append(el('div', { className: 'banner ok', style: 'margin-top:10px', textContent: t(`Saved in “${state.folder}” of ${d.account}. Open your mail app to review and send it.`, `Guardado en “${state.folder}” de ${d.account}. Abrí tu app de mail para revisarlo y enviarlo.`) }));\n  }\n  app.append(el('div', { className: 'footnote', textContent: t('allinbox never sends email. Saving only puts this draft in your Drafts folder.', 'allinbox nunca envía mails. Guardar solo deja este borrador en tu carpeta Borradores.') }));\n}\n\nconst canSave = () => {\n  const d = state.draft;\n  return d.to.length > 0 && d.body.trim().length > 0 && (d.subject.trim() || d.replyToId) && !blocked([...d.to, ...d.cc], d.allow).length;\n};\n\nasync function save() {\n  const d = state.draft;\n  state.status = 'saving';\n  state.error = '';\n  render();\n  try {\n    const result = await bridge.callTool('save_draft', {\n      account: d.account,\n      to: d.to,\n      ...(d.cc.length ? { cc: d.cc } : {}),\n      ...(d.subject.trim() ? { subject: d.subject.trim() } : {}),\n      body: d.body,\n      ...(d.replyToId ? { reply_to_id: d.replyToId } : {}),\n    });\n    state.status = 'saved';\n    state.folder = result?._meta?.['allinbox/ui']?.folder ?? 'Drafts';\n    render();\n    bridge.updateModelContext(`The user reviewed the draft to ${d.to.join(', ')} and saved it in the Drafts folder of ${d.account}. It was NOT sent.`).catch(() => {});\n  } catch (e) {\n    state.status = 'editing';\n    state.error = String(e.message ?? e);\n    render();\n  }\n}\n\nfunction discard() {\n  state.status = 'discarded';\n  render();\n  bridge.updateModelContext('The user discarded the proposed draft. Nothing was saved.').catch(() => {});\n}\n\nlet args = {};\nbridge.on('ui/notifications/tool-input', (p) => { args = p.arguments ?? {}; });\nbridge.on('ui/notifications/tool-result', (result) => {\n  if (result.isError) {\n    app.replaceChildren(el('div', { className: 'banner', style: 'margin:12px', textContent: bridge.textOf(result) }));\n    return;\n  }\n  state.draft = fromResult(result, args);\n  if (state.draft.mode === 'saved') {\n    state.status = 'saved';\n    state.folder = state.draft.folder || 'Drafts';\n  }\n  render();\n});\n\nbridge.connect('allinbox-draft').then(() => {\n  document.getElementById('loading').textContent = t('Preparing the draft…', 'Preparando el borrador…');\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};

    return textResult(b.slice(0, blank).join('\n') + '\n\n' + b.slice(blank + 1).join('\n'));
  }
  if (tool === 'read_thread') return textResult(THREADS[args.id] ?? 'Thread (1 message)\n\n' + (MOCK.bodies[args.id]?.slice(-1)[0] ?? '(sample)'));
  if (tool === 'save_draft') {
    log(name, 'tools/call save_draft → ' + JSON.stringify(args));
    return { content: [{ type: 'text', text: 'Draft saved in "[Gmail]/Drafts" of ' + args.account + '. NOT sent.' }], _meta: { 'allinbox/ui': { mode: 'saved', folder: '[Gmail]/Drafts' } } };
  }
  throw new Error('Unknown tool ' + tool);
}

window.addEventListener('message', (e) => {
  const name = Object.keys(frames).find((k) => frames[k].contentWindow === e.source);
  if (!name) return;
  const win = e.source;
  const m = e.data;
  if (m?.jsonrpc !== '2.0') return;
  switch (m.method) {
    case 'ui/initialize':
      return reply(win, m.id, { protocolVersion: '2026-01-26', hostInfo: { name: 'mock-host', version: '0' }, hostCapabilities: {}, hostContext: { theme, locale } });
    case 'ui/notifications/initialized':
      setTimeout(() => {
        notify(win, 'ui/notifications/tool-input', { arguments: MOCK[name].input });
        setTimeout(() => notify(win, 'ui/notifications/tool-result', MOCK[name].result), 500);
      }, 300);
      return;
    case 'ui/notifications/size-changed':
      frames[name].style.height = Math.ceil(m.params.height) + 'px';
      return;
    case 'tools/call':
      return setTimeout(() => {
        try { reply(win, m.id, handleTool(name, m.params)); } catch (err) { fail(win, m.id, String(err.message)); }
      }, 450);
    case 'ui/message':
      log(name, 'ui/message → ' + m.params.content.text);
      return reply(win, m.id, {});
    case 'ui/update-model-context':
      log(name, 'ui/update-model-context → ' + m.params.content[0].text);
      return reply(win, m.id, {});
    default:
      if (m.id !== undefined) fail(win, m.id, 'Not supported in the preview');
  }
});

function mount() {
  document.body.classList.toggle('dark', theme === 'dark');
  const es = locale.startsWith('es');
  document.querySelectorAll('[data-es]').forEach((n) => (n.textContent = es ? n.dataset.es : n.dataset.en));
  document.getElementById('theme').textContent = theme === 'dark' ? (es ? 'Claro' : 'Light') : (es ? 'Oscuro' : 'Dark');
  document.getElementById('lang').textContent = es ? 'English' : 'Español';
  for (const name of ['search', 'draft']) {
    const f = document.getElementById(name);
    frames[name] = f;
    document.getElementById(name + '-log').replaceChildren();
    f.setAttribute('sandbox', 'allow-scripts');
    f.srcdoc = VIEWS[name];
  }
}
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; mount(); };
document.getElementById('lang').onclick = () => { locale = locale.startsWith('es') ? 'en-US' : 'es-AR'; mount(); };
mount();
</script>
